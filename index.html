<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Last One</title>
    <meta id="meta-theme-color" name="theme-color" content="#c2e9fb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="preload" href="cake.svg" as="image" type="image/svg+xml" fetchpriority="low" />
    <link rel="prefetch" href="dashboard.html" as="document" />
    <link rel="stylesheet" href="book.css?v=2" />
    <script type="speculationrules">
      {
        "prefetch": [
          {
            "where": { "selector_matches": "a[href='dashboard.html']" },
            "eagerness": "eager"
          }
        ],
        "prerender": [
          {
            "where": { "selector_matches": "a[href='dashboard.html']" },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>

  <body>
    <canvas id="stars-canvas" aria-hidden="true"></canvas>
    <div id="sky-glow" aria-hidden="true"></div>
    <div id="dust" aria-hidden="true"></div>
    <canvas id="moonCanvas" class="celestial" width="80" height="80" aria-hidden="true"></canvas>
    <canvas id="sunCanvas" class="celestial" width="80" height="80" aria-hidden="true"></canvas>

    <!-- ================= POPUP AWAL ================= -->
    <div id="ux-popup" class="overlay-screen">
      <div class="note-card">
        <div class="seal" aria-hidden="true">🎀</div>
        <h2>Tunggu Sebentar! 🛑</h2>
        <p>
          Agar suara, lagu, dan animasi kado ini berjalan sempurna, sangat disarankan membukanya lewat <b>Browser Utama (Chrome)</b> ya.
        </p>
        <p class="copy-url">copy <i>https://piscokz.github.io/project-dadakan/</i></p>
        <div class="popup-actions">
          <button class="btn-primary" id="popupOk">Oke, Mengerti! ✨</button>
          <a class="popup-shortcut" href="dashboard.html">
            <span aria-hidden="true">🎮</span>
            <span>Katalog Mini Game</span>
          </a>
        </div>
      </div>
    </div>

    <!-- ================= LOADING ================= -->
    <div id="loading-screen" class="overlay-screen" hidden>
      <div class="loader-book" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="loading-text">Membuka kado... 🎉</div>
    </div>

    <!-- ================= BUKU ================= -->
    <nav class="shortcut-bar" aria-label="Pintasan game">
      <a class="catalog-shortcut" href="dashboard.html">
        <span aria-hidden="true">🎮</span>
        <span>Katalog Mini Game</span>
      </a>
    </nav>

    <main class="stage">
      <div class="book-wrap">
        <div class="book" id="book">
          <aside class="book-left" aria-hidden="true">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <div class="ribbon"></div>
            <div class="crest">❦</div>
            <h1 class="cover-title">The Last One</h1>
            <p class="cover-name">Silvia</p>
            <div class="cover-line"></div>
          </aside>

          <section class="book-right" id="bookRight">
            <div class="page-base" id="pageBase" aria-live="polite" aria-atomic="true"></div>
            <div class="page-shade" aria-hidden="true"></div>
            <button class="page-curl" id="pageCurl" aria-label="Buka halaman berikutnya" tabindex="-1"></button>
          </section>
        </div>
        <div class="book-shadow" aria-hidden="true"></div>
      </div>

      <nav class="book-nav" aria-label="Navigasi halaman">
        <button class="nav-btn" id="prevBtn" aria-label="Halaman sebelumnya" disabled>&#10094;</button>
        <div class="simulator-control">
          <span id="time-label">Waktu: 12:00</span>
          <input type="range" id="timeSlider" min="0" max="23" value="12" aria-label="Simulasi jam" />
        </div>
        <button class="nav-btn" id="nextBtn" aria-label="Halaman berikutnya">&#10095;</button>
      </nav>
    </main>

    <!-- ================= ISI HALAMAN ================= -->
    <template class="page-tpl" id="tpl-0">
      <div class="page-inner page-title">
        <h2>Hai! Siapa ini? 👀</h2>
        <p>Masukkan <b>Tanggal</b> dan <b>Bulan</b> lahirmu.<br />(Contoh: 26 Desember = 2612)</p>
        <div class="pin-container">
          <input type="tel" inputmode="numeric" class="pin-box" maxlength="1" aria-label="Digit pertama" />
          <input type="tel" inputmode="numeric" class="pin-box" maxlength="1" aria-label="Digit kedua" />
          <span class="pin-separator">-</span>
          <input type="tel" inputmode="numeric" class="pin-box" maxlength="1" aria-label="Digit ketiga" />
          <input type="tel" inputmode="numeric" class="pin-box" maxlength="1" aria-label="Digit keempat" />
        </div>
        <p class="error-text" role="alert">Ups! Salah, coba ingat lagi ya! 🤭</p>
        <div class="pin-skip-wrap">
          <p class="skip-hint">Atau langsung main tanpa PIN:</p>
          <a class="pin-skip-link" href="dashboard.html">
            <span aria-hidden="true">🎮</span>
            <span>Katalog Mini Game</span>
          </a>
        </div>
      </div>
    </template>

    <template class="page-tpl" id="tpl-1">
      <div class="page-inner">
        <h1>Halo, Silvia ✨</h1>
        <p>Aku punya sedikit presentasi kecil. Klik panah di bawah ya</p>
        <span class="folio">02</span>
      </div>
    </template>

    <template class="page-tpl" id="tpl-2">
      <div class="page-inner">
        <img class="cake" src="cake.svg" alt="Kue" width="210" height="210" decoding="async" />
        <h2>Selamat Ulang Tahun 🎂</h2>
        <p>Semoga di perkuliahan nanti, kamu semakin bahagia, sehat selalu, serta diberi lingkungan pertemanan yang baik.</p>
        <span class="folio">03</span>
      </div>
    </template>

    <template class="page-tpl" id="tpl-3">
      <div class="page-inner">
        <h1><i>Yeeeayy!</i> &nbsp;🥳</h1>
        <p>Jangan lupa habbit baca buku nya dan jangan pikir hasil studi akademik kamu sia-sia yaa ~~ Thankssss!!</p>
        <span class="folio">04</span>
      </div>
    </template>

    <template class="page-tpl" id="tpl-4">
      <div class="page-inner page-end">
        <h1>Terima Kasih !</h1>
        <a class="gift-box" id="giftBox" href="dashboard.html" aria-label="Buka hadiah: katalog mini game">
          <span class="teks-hadiah">Hadiah buat kamu<em>Buka mini game</em></span>
        </a>
        <div class="page-actions">
          <a class="btn-primary" href="dashboard.html">Katalog Mini Game ✨</a>
          <button class="btn-ghost" id="restartBtn">🔁 Tonton Lagi</button>
        </div>
        <span class="folio">05</span>
      </div>
    </template>

    <audio id="bgm" loop preload="auto"><source src="bg.mp3" type="audio/mpeg" /></audio>

    <script defer src="book.js?v=2"></script>
    <script defer src="sw-register.js?v=1"></script>
  </body>
</html>
